[build]
  publish = "publish/wwwroot"
  command = "dotnet publish -c Release -o publish"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/_framework/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/_framework/*"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.dll"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/_framework/blazor.webassembly.js"
  [headers.values]
    Content-Type = "application/javascript"